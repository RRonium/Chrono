name: Refresh country data

# Rebuilds data/countries/ (World Bank indicators, outlines, metadata) and commits any change.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 1 * *" # monthly; the World Bank publishes annual figures
  push:
    paths: ["scripts/refresh_country_data.py", ".github/workflows/country-data.yml"]

permissions:
  contents: write
  actions: write

concurrency:
  group: country-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Rebuild data/countries
        run: python scripts/refresh_country_data.py
      - name: Commit changes
        id: commit
        run: |
          git add data/countries
          if git diff --cached --quiet; then
            echo "No data changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name RRonium
          git config user.email 219181010+RRonium@users.noreply.github.com
          git commit -m "data: refresh country data $(date -u +%Y-%m-%d)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # Pushes made with GITHUB_TOKEN do not trigger other workflows, so redeploy the site explicitly.
      - name: Redeploy Pages
        if: steps.commit.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

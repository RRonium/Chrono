name: Check market symbols

on:
  pull_request:
    paths: ["data/countries/*/market.json", "services/ingestion/connectors/country_markets.py", "scripts/check_market_symbols.py"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance
      - run: python scripts/check_market_symbols.py

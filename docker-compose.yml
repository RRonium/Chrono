version: '3.8'

services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: chrono-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chrono_db}
      POSTGRES_USER: ${POSTGRES_USER:-chrono_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chrono_password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/postgres/init.sql:/docker-entrypoint-initdb.d/01-postgres-init.sql:ro
      - ./database/timescaledb/init.sql:/docker-entrypoint-initdb.d/02-timescale-init.sql:ro

  mongodb:
    image: mongo:7.0
    container_name: chrono-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

  redis:
    image: redis:7-alpine
    container_name: chrono-redis
    restart: always
    command: "redis-server --save 60 1 --loglevel notice"
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  mongodata:
  redisdata:
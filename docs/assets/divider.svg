<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 34" width="1200" height="34" role="img" aria-label="Divider: Chrono's live channels and country paths scrolling like the markets ticker">
  <defs>
    <linearGradient id="f" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#08111f"/><stop offset="0.08" stop-color="#08111f" stop-opacity="0"/>
      <stop offset="0.92" stop-color="#08111f" stop-opacity="0"/><stop offset="1" stop-color="#08111f"/>
    </linearGradient>
    <clipPath id="c"><rect width="1200" height="34" rx="4"/></clipPath>
  </defs>
  <g clip-path="url(#c)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'JetBrains Mono', monospace" font-size="12" letter-spacing="1">
    <rect width="1200" height="34" fill="#08111f"/>
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-793 0" dur="22s" repeatCount="indefinite"/>
      <g id="r"><text x="24" y="21.5" fill="#d4a64a">● market:ticks:all</text><text x="189.4" y="21.5" fill="#5999ff">● news:articles</text><text x="332.9" y="21.5" fill="#e8c882">◆ /ws/live</text><text x="439.9" y="21.5" fill="#22c55e">● data/countries/&lt;ISO&gt;</text><text x="634.5" y="21.5" fill="#8fa0b8">◆ /country/&lt;iso&gt;/</text></g>
      <use href="#r" x="793"/>
      <use href="#r" x="1585"/>
    </g>
    <rect width="1200" height="34" fill="url(#f)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="33" rx="4" fill="none" stroke="#d4a64a" stroke-opacity="0.3"/>
  <line x1="0" y1="17.0" x2="0" y2="17.0"/>
</svg>
